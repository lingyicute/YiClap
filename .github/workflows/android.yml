name: Android CI

on:
  push:
    paths-ignore:
      - '**.md'

permissions:   
  contents: write
  
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v3

      - name: Chmod
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew app:assemble && tree app/build/outputs/apk/release/
        
      - name: Delete old nightly release 
        run: gh release delete nightly --yes --cleanup-tag || true
        env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish nightly release 
        run: |
            gh release create nightly \
              app/build/outputs/apk/release/*.apk \
            --title "Nightly Build" \
            --notes "auto build · ${GITHUB_SHA:0:7} · ${GITHUB_REF_NAME}" \
            --prerelease \
            --target "$GITHUB_SHA"
        env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ github.workspace }}//app/build/outputs/apk/release/
